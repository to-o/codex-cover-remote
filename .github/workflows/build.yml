name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Static checks
        run: |
          python3 -m py_compile build-linux.py release/make_release.py termux/bin/*.py
          python3 -m unittest discover -s tests -v
      - name: Build unsigned APK
        run: |
          python3 build-linux.py \
            --android-jar "$ANDROID_HOME/platforms/android-34/android.jar" \
            --r8-jar "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-cover-unsigned
          path: out/codex-cover-unsigned.apk
          retention-days: 7
