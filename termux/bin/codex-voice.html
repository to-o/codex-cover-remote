<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex Live</title>
<style>
:root{color-scheme:dark;--bg:#0a0f16;--panel:#151e29;--edge:#243441;--accent:#72e5b5;--fg:#f0f5fb;--muted:#91a4b7;--error:#fc9598}
*{box-sizing:border-box}
html,body{min-width:0;min-height:100%;margin:0}
body{font:13px/1.45 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:var(--fg);background:var(--bg);padding:max(9px,env(safe-area-inset-top)) 13px max(12px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.shell{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:calc(100dvh - 26px)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.brand{font-size:16px;font-weight:750;letter-spacing:.1px;display:flex;align-items:center;gap:7px}
.mark{width:25px;height:25px;border-radius:9px;color:var(--accent);background:#1b2e2b;display:grid;place-items:center;font-size:15px}
.tag{font-size:10px;color:var(--accent);background:#18362c;border:1px solid #2a6049;padding:4px 9px;border-radius:30px}
.stage{border-radius:21px;background:radial-gradient(ellipse 72% 80% at 50% 50%,#1c3c37 0%,#16262c 51%,#151e29 100%);border:1px solid #284339;min-height:122px;padding:9px 14px 11px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:45px;overflow:hidden;width:100%}
.wave i{display:block;width:4px;flex:0 0 4px;height:13px;border-radius:4px;background:#549e87;opacity:.65;transform-origin:center}
.wave i:nth-child(5n+1){height:10px}
.wave i:nth-child(4n+2){height:29px}
.wave i:nth-child(6n+3){height:38px}
.wave i:nth-child(7n+4){height:22px}
body.connected:not(.is-muted) .wave i{background:var(--accent);opacity:1;animation:dance .83s ease-in-out infinite alternate;animation-delay:calc(var(--index,0) * -37ms)}
body.connected:not(.is-muted) .wave i:nth-child(2n){animation-duration:1.15s}
body.is-error .wave i{background:var(--error)}
@keyframes dance{from{transform:scaleY(.45)}to{transform:scaleY(1.3)}}
#state{text-align:center;font-size:16px;font-weight:700;color:var(--fg);margin-top:5px}
#hint{text-align:center;font-size:11px;color:#a4b7c3;margin-top:4px;max-width:300px}
.actions{display:flex;gap:8px;flex-shrink:0}
button{appearance:none;-webkit-appearance:none;border:0;border-radius:13px;min-height:44px;padding:8px 12px;font:600 13px system-ui,sans-serif;color:var(--fg);background:#24313e;flex:1;touch-action:manipulation}
button:active:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.42}
#start{background:var(--accent);color:#0a251d;flex:1.5}
#stop{background:#512c35;color:#ffe1e3;flex:1}
#mute{background:#1a2937;min-height:38px}
#play{display:none;background:#244c40}
#task{min-height:0;margin:0;color:#8fa3b5;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transcript-wrap{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:10px 12px;min-height:78px;display:flex;flex-direction:column;flex:1}
.transcript-head{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;color:#8e9faf;font-weight:700;margin-bottom:5px}
#transcript{font-size:12px;line-height:1.55;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap;max-height:20vh;min-height:48px;flex:1;color:#bccbd7;scrollbar-width:thin}
.role{color:var(--accent);font-size:10px;font-weight:650;margin-bottom:2px}
.line{margin-bottom:8px}
#approval{display:none;background:#2b242a;border:1px solid #6b4b55;border-radius:15px;padding:11px}
#approval .ap-title{font-size:12px;font-weight:700;color:#ffe8db}
#approvalText{font-size:11px;color:#f4d9d2;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;max-height:20vh;overflow:auto;margin:6px 0 9px}
#allow{background:#3b6454}
#deny{background:#4d303a}
.footnote{text-align:center;font-size:9px;color:#596b7d}
audio{display:none}
@media(max-height:480px){.shell{gap:6px}.stage{min-height:102px;padding:5px 12px}.wave{height:36px}.transcript-wrap{min-height:65px}#transcript{max-height:16vh;min-height:36px}.footnote{display:none}}
@media(prefers-reduced-motion:reduce){body.connected .wave i{animation:none!important}}
</style>
</head>
<body>
<main class="shell">
 <header class="top"><div class="brand"><div class="mark">✦</div>Codex Live</div><span class="tag">实时语音</span></header>
 <section class="stage" aria-live="polite">
  <div class="wave" aria-hidden="true"><i style="--index:0"></i><i style="--index:1"></i><i style="--index:2"></i><i style="--index:3"></i><i style="--index:4"></i><i style="--index:5"></i><i style="--index:6"></i><i style="--index:7"></i><i style="--index:8"></i><i style="--index:9"></i><i style="--index:10"></i><i style="--index:11"></i><i style="--index:12"></i><i style="--index:13"></i><i style="--index:14"></i><i style="--index:15"></i><i style="--index:16"></i><i style="--index:17"></i><i style="--index:18"></i><i style="--index:19"></i><i style="--index:20"></i><i style="--index:21"></i><i style="--index:22"></i><i style="--index:23"></i><i style="--index:24"></i><i style="--index:25"></i><i style="--index:26"></i></div>
  <div id="state">准备就绪</div>
  <div id="hint">开始对话后，直接说话即可</div>
 </section>
 <div class="actions"><button id="start">✦ 开始对话</button><button id="stop" disabled>结束对话</button></div>
 <div class="actions"><button id="mute" disabled>关闭麦克风</button><button id="play">播放声音</button></div>
 <section id="approval">
  <div class="ap-title">Codex 请求执行权限</div><div id="approvalText"></div>
  <div class="actions"><button id="allow">允许本次</button><button id="deny">拒绝</button></div>
 </section>
 <div id="task" aria-live="polite"></div>
 <section class="transcript-wrap">
  <div class="transcript-head"><span>实时字幕</span><span>LIVE TRANSCRIPT</span></div>
  <div id="transcript">语音内容会显示在这里。</div>
 </section>
 <div class="footnote">离开页面即停止麦克风 · 使用当前 Codex 登录</div>
 <audio id="speaker" autoplay playsinline></audio>
</main>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);
let pc=null,mic=null,pollTimer=null,cursor=0,starting=false,epoch=0,muted=false,approvalId=null,utterance=null,utteranceRole='',taskText='';
async function api(path,data={},timeout=60000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
 try{const response=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(data),signal:controller.signal});
 const value=await response.json();if(!response.ok)throw Error(value.error||'语音服务请求失败');return value;}finally{clearTimeout(timer);}
}
function status(text,error=false){
 $('state').textContent=text;
 document.body.classList.toggle('is-error',error);
 document.body.classList.toggle('connected',!!pc&&pc.connectionState==='connected'&&!error);
 document.body.classList.toggle('is-muted',muted);
}
function transcript(role,text,done=false){
 if(!text)return;
 if(!utterance||utteranceRole!==role){
  if(!$('transcript').querySelector('.line'))$('transcript').textContent='';
  const line=document.createElement('div');line.className='line';
  const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'你':'Codex';line.append(label);
  utterance=document.createElement('span');line.append(utterance);$('transcript').append(line);utteranceRole=role;
  while($('transcript').children.length>24)$('transcript').firstChild.remove();
 }
 if(done){utterance.textContent=text;utterance=null;utteranceRole='';}else utterance.textContent+=text;
 $('transcript').scrollTop=$('transcript').scrollHeight;
}
function cleanMedia(){
 if(mic)mic.getTracks().forEach(track=>track.stop());mic=null;
 if(pc){pc.onconnectionstatechange=null;pc.close();pc=null;}
 $('speaker').srcObject=null;clearTimeout(pollTimer);pollTimer=null;
 $('mute').disabled=true;$('stop').disabled=true;$('start').disabled=false;$('start').textContent='✦ 再次对话';
 $('play').style.display='none';$('approval').style.display='none';approvalId=null;muted=false;$('mute').textContent='关闭麦克风';
}
async function stopVoice(text='语音已结束'){
 ++epoch;starting=false;cleanMedia();status(text);try{await api('stop',{},12000);}catch(error){status(text+' · '+error.message,true);}
}
async function poll(current){
 if(current!==epoch||!pc)return;
 try{const result=await api('events',{since:cursor},8000);cursor=result.cursor;
  for(const event of result.events){
   if(event.kind==='transcript')transcript(event.role,event.delta);
   else if(event.kind==='transcriptDone')transcript(event.role,event.text,true);
   else if(event.kind==='task'){taskText=(taskText+event.delta).slice(-300);$('task').textContent=taskText;}
   else if(event.kind==='status'){$('task').textContent=event.text;taskText='';}
   else if(event.kind==='approval'){approvalId=event.id;$('approvalText').textContent=event.text;$('approval').style.display='block';}
   else if(event.kind==='error'||event.kind==='closed'){await stopVoice(event.text||'连接已结束');return;}
  }
 }catch(error){await stopVoice('连接中断：'+error.message);return;}
 if(current===epoch&&pc)pollTimer=setTimeout(()=>poll(current),500);
}
async function startVoice(){
 if(starting||pc)return;starting=true;const current=++epoch;
 $('start').disabled=true;$('stop').disabled=false;status('正在准备麦克风…');
 try{
  const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(current!==epoch){acquired.getTracks().forEach(t=>t.stop());return;}mic=acquired;
  pc=new RTCPeerConnection({iceServers:[]});const connection=pc;
  mic.getTracks().forEach(track=>connection.addTrack(track,mic));
  connection.createDataChannel('oai-events');
  connection.ontrack=event=>{$('speaker').srcObject=event.streams[0]||new MediaStream([event.track]);$('speaker').play().catch(()=>$('play').style.display='block');};
  connection.onconnectionstatechange=()=>{
   if(connection!==pc)return;
   if(connection.connectionState==='connected'){status('已连接 · 可以说话');$('hint').textContent='可以连续交谈，Codex 工作时也能补充要求。';$('mute').disabled=false;}
   else if(connection.connectionState==='failed')stopVoice('语音网络连接失败，请重试');
  };
  status('正在连接 Codex Live…');
  await connection.setLocalDescription(await connection.createOffer());
  await new Promise(resolve=>{
   if(connection.iceGatheringState==='complete')return resolve();
   const timer=setTimeout(resolve,1800);
   connection.addEventListener('icegatheringstatechange',()=>{if(connection.iceGatheringState==='complete'){clearTimeout(timer);resolve();}});
  });
  // Start at the current event cursor so a previous call's close cannot end this one.
  cursor=(await api('events',{since:0})).cursor;
  const result=await api('start',{sdp:connection.localDescription.sdp});
  if(current!==epoch){await api('stop');return;}
  await connection.setRemoteDescription({type:'answer',sdp:result.sdp});
  poll(current);starting=false;
  setTimeout(()=>{if(current===epoch&&pc&&pc.connectionState!=='connected')stopVoice('连接超时，请检查代理和网络后重试');},25000);
 }catch(error){if(current===epoch){await stopVoice(error.name==='NotAllowedError'?'需要麦克风权限，请返回后重试':'连接失败：'+error.message);}}
 finally{if(current===epoch)starting=false;}
}
$('start').onclick=startVoice;$('stop').onclick=()=>stopVoice();
$('mute').onclick=()=>{muted=!muted;if(mic)mic.getAudioTracks().forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'打开麦克风':'关闭麦克风';status(muted?'麦克风已关闭':'已连接 · 可以说话');};
$('play').onclick=()=>$('speaker').play().then(()=>$('play').style.display='none').catch(()=>status('无法播放，请检查媒体音量',true));
async function decide(allow){const id=approvalId;if(!id)return;$('allow').disabled=$('deny').disabled=true;try{await api('approval',{id,allow});if(approvalId===id){approvalId=null;$('approval').style.display='none';}}catch(error){status(error.message,true);}finally{$('allow').disabled=$('deny').disabled=false;}}
$('allow').onclick=()=>decide(true);$('deny').onclick=()=>decide(false);
window.stopVoice=stopVoice;
addEventListener('pagehide',()=>{cleanMedia();fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:'{}',keepalive:true}).catch(()=>{});});
</script>
</html>
